<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar · OptiWare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #168d5c;
        --primary-light: #e9f5ed;
        --text-main: #0b4263;
        --text-muted: #5f7785;
        --bg-color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background: linear-gradient(145deg, #eaf2f5, #eef6f1 70%, #e4f0e8);
        color: var(--text-main);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .wrap { width: min(420px, 100%); }

      .brand {
        margin: 0 0 28px;
        text-align: center;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.8px;
      }

      .brand-ware { color: #58b883; }

      .card {
        padding: 38px;
        border: 1px solid #e5ebf1;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 20px 70px rgba(31, 55, 80, 0.08);
      }

      .overline {
        color: var(--primary);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      h1 { margin: 10px 0 8px; font-size: 29px; letter-spacing: -0.8px; }

      .intro {
        margin: 0 0 26px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .field { margin: 15px 0; }

      label {
        display: block;
        margin: 0 0 7px;
        color: #334a61;
        font-size: 12px;
        font-weight: 700;
      }

      input {
        display: block;
        width: 100%;
        height: 46px;
        padding: 0 13px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #fff;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(22, 141, 92, 0.12);
      }

      .primary {
        width: 100%;
        height: 47px;
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .primary:hover { background: #107349; }
      .primary:disabled { cursor: wait; opacity: 0.7; }

      .switch {
        margin-top: 18px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }

      .switch a {
        margin-left: 5px;
        color: #107349;
        font-weight: 800;
        text-decoration: none;
      }

      .switch a:hover { text-decoration: underline; }

      .notice {
        display: none;
        margin: 14px 0 0;
        padding: 11px 12px;
        border-radius: 9px;
        font-size: 12px;
        line-height: 1.5;
      }

      .notice.error { display: block; background: #fff0ef; color: #a32c28; }

      @media (max-width: 480px) { .card { padding: 30px 25px; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand"><span>Opti</span><span class="brand-ware">Ware</span></div>
      <section class="card">
        <div class="overline">Daftar akun</div>
        <h1>Buat akun admin</h1>
        <p class="intro">Isi username dan password untuk mulai menggunakan OptiWare.</p>
        <form id="registerForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Buat username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter" minlength="6" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Ulangi password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Ulangi password" minlength="6" required />
          </div>
          <button class="primary" id="submitBtn" type="submit">Buat akun</button>
        </form>
        <div class="notice" id="notice" role="status"></div>
        <div class="switch">Sudah memiliki akun? <a href="login.html">Masuk</a></div>
      </section>
    </main>
    <script>
      (() => {
        const form = document.getElementById("registerForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const submitBtn = document.getElementById("submitBtn");
        const notice = document.getElementById("notice");

        function showError(message) {
          notice.textContent = message;
          notice.className = "notice error";
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          notice.textContent = "";
          notice.className = "notice";

          if (passwordInput.value !== confirmPasswordInput.value) {
            showError("Password yang dimasukkan belum sama.");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Memproses...";
          try {
            const response = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: usernameInput.value.trim(),
                password: passwordInput.value,
              }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.pesan || "Pendaftaran gagal.");
            window.location.href = "/";
          } catch (error) {
            showError(error.message || "Ada kendala saat mendaftar.");
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Buat akun";
          }
        });
      })();
    </script>
  </body>
</html>
