<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · OptiWare</title>
  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css" type="text/css">
  <script src="https://cdn.webix.com/edge/webix.js" type="text/javascript"></script>
  <style>
    :root{--navy:#10213a;--teal:#16b8a6;--ink:#1a2a3d;--muted:#78879a;--line:#e5ebf1;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{height:100vh;min-height:620px}.webix_view,.webix_layout_line,.webix_layout_wide{font-family:inherit}.webix_toolbar{background:#fff;border:0}.webix_el_button button{border-radius:8px;font-weight:650}.webix_el_button .webix_icon_btn{color:inherit}.webix_button{font-family:inherit}
    .top-brand{display:flex;align-items:center;gap:11px;padding-left:5px}.top-logo{width:150px;height:80px;object-fit:cover}.top-mark{width:39px;height:39px;background:#16b8a6;border-radius:11px;display:grid;place-items:center;color:#08232d}.top-name{font-weight:850;letter-spacing:-.5px;font-size:20px;color:#10213a}.top-sub{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:#8290a2;margin-top:3px}
    .side{background:#10213a!important;border:0!important}.side .webix_list_item{height:46px!important;line-height:46px!important;border:0!important;color:#b6c4d5!important;border-radius:9px!important;margin:4px 12px;width:calc(100% - 24px);padding-left:14px!important;font-size:13px}.side .webix_list_item.webix_selected{background:#1e3e58!important;color:#70e1d4!important;font-weight:750}.side .webix_list_item:hover{background:#1a334d!important}.nav-heading{padding:26px 20px 8px;color:#718aa2;letter-spacing:1.5px;font-size:10px;font-weight:800}.side-bottom{margin:20px 14px;padding:15px 13px;border:1px solid #2a415a;border-radius:11px;color:#b4c3d3;font-size:11px;line-height:1.6}.side-bottom strong{display:block;color:#e5f0fa;font-size:12px;margin-bottom:4px}
    .page-heading{font-size:23px;font-weight:800;color:#182b40;letter-spacing:-.7px}.page-sub{font-size:12px;color:#8491a2;margin-top:5px}.section-title{font-size:15px;font-weight:800;color:#20344b}.section-sub{font-size:12px;color:#8794a5;margin-top:4px}.kpi-card{height:114px;padding:16px 18px;border:1px solid #e5ebf1;background:white;border-radius:13px;display:flex;flex-direction:column;justify-content:space-between}.kpi-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#78879a;font-weight:600}.kpi-icon{width:31px;height:31px;border-radius:9px;background:#e5faf6;color:#078e81;display:grid;place-items:center;font-size:17px}.kpi-value{font-size:25px;line-height:1.1;font-weight:850;color:#1b2c40;letter-spacing:-.6px}.kpi-note{font-size:10px;color:#8996a5}.kpi-note.warn{color:#ce7d14}.panel{border:1px solid #e5ebf1;background:white;border-radius:13px;overflow:hidden}.panel-heading{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between}.panel-heading h3{font-size:14px;margin:0;font-weight:800}.panel-heading p{font-size:11px;margin:5px 0 0;color:#8996a5}
    .webix_dtable{border:0!important}.webix_dtable .webix_cell [class*="badge"],.webix_dtable .webix_cell [class*="-tag"],.webix_dtable .webix_cell .stock-ok,.webix_dtable .webix_cell .stock-low{margin:2px 5px}.webix_ss_header{background:#f8fafc!important}.webix_hcell{font-size:11px!important;font-weight:750!important;color:#718096!important;border-color:#edf1f5!important}.webix_cell{font-size:12px!important;color:#334a60!important;border-color:#edf1f5!important}.webix_ss_body .webix_cell.webix_cell_select,.webix_ss_body .webix_cell.webix_dtable_select{background:#e6f8f5!important}.webix_win{border-radius:14px;overflow:hidden}.webix_win_head{background:#10213a!important;color:white!important}.webix_win_head .webix_template{color:white!important;font-weight:750}.webix_form .webix_inp_label{font-size:12px;font-weight:700;color:#506176}.webix_el_text input,.webix_el_combo input,.webix_el_richselect input{border-radius:8px!important}.webix_message_area{z-index:99999}.stock-low{color:#c47716;font-weight:800}.stock-ok{color:#158b70;font-weight:700}.empty-copy{padding:20px;color:#8b97a7;font-size:12px;text-align:center}
    @media(max-width:800px){#app{min-height:700px}.top-sub{display:none}.page-heading{font-size:19px}.kpi-value{font-size:21px}.side{width:160px!important}.side .webix_list_item{padding-left:9px!important;margin-left:7px;width:calc(100% - 14px);font-size:11px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>window.OPTIWARE_USER = {{ user_name|tojson }};</script>
<script>
(() => {
  const fmtMoney = value => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value || 0));
  const fmtDate = value => { if (!value) return '-'; const date = new Date(value); return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}); };
  const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  async function api(url, options={}) {
    const response = await fetch(url, {credentials:'same-origin', ...options, headers:{'Content-Type':'application/json', ...(options.headers || {})}});
    const body = await response.json().catch(() => ({}));
    if (response.status === 401) { window.location.href = '/'; throw new Error('Sesi login berakhir.'); }
    if (!response.ok) throw new Error(body.message || 'Permintaan tidak berhasil.');
    return body;
  }
  function toast(message, type='success') { webix.message({text:message,type:type==='error'?'error':'success',expire:3500}); }
  function fail(error) { toast(error.message || 'Terjadi kesalahan.', 'error'); }
  let productsCache = [];
  let salesCache = [];
  let editingProductId = null;

  function loadProducts() {
    return api('/api/products').then(result => {
      productsCache = result.data;
      if ($$('productsGrid')) $$('productsGrid').clearAll(), $$('productsGrid').parse(productsCache);
      if ($$('saleProduct')) $$('saleProduct').define('options', productsCache.map(p => ({id:p.id, value:`${p.name} — stok ${p.stock}`}))), $$('saleProduct').refresh();
      if ($$('productPickerHint')) $$('productPickerHint').setHTML(productsCache.length ? 'Pilih produk dan jumlah unit yang dijual.' : 'Tambahkan produk terlebih dahulu sebelum membuat transaksi.');
      return productsCache;
    });
  }
  function loadSales() {
    return api('/api/sales').then(result => {
      salesCache = result.data;
      if ($$('salesGrid')) { $$('salesGrid').clearAll(); $$('salesGrid').parse(salesCache); }
      return salesCache;
    });
  }
  function updateKpi(id, value, note, warn=false) {
    const node = $$(id) && $$(id).getNode();
    if (!node) return;
    const valueNode = node.querySelector('.kpi-value');
    const noteNode = node.querySelector('.kpi-note');
    if (valueNode) valueNode.textContent = value;
    if (noteNode) { noteNode.textContent = note || ''; noteNode.classList.toggle('warn', !!warn); }
  }
  function loadStats() {
    return api('/api/stats').then(result => {
      const data = result.data;
      updateKpi('kpiProducts', data.productCount, 'Jenis produk terdaftar');
      updateKpi('kpiStock', Number(data.stockUnits).toLocaleString('id-ID'), 'Total unit persediaan');
      updateKpi('kpiRevenue', fmtMoney(data.revenue), `${data.saleCount} transaksi tercatat`);
      updateKpi('kpiLowStock', data.lowStock, data.lowStock ? 'Perlu diperiksa' : 'Semua stok di atas batas', data.lowStock > 0);
      if ($$('latestSalesGrid')) { $$('latestSalesGrid').clearAll(); $$('latestSalesGrid').parse(data.latestSales); }
    });
  }
  function refreshAll() { return Promise.all([loadProducts(), loadSales(), loadStats()]).catch(fail); }

  function openProductWindow(product=null) {
    editingProductId = product ? product.id : null;
    const isEdit = !!product;
    const formElements = [
      {view:'text', label:'SKU / Kode produk', name:'sku', required:true, placeholder:'Contoh: OW-001'},
      {view:'text', label:'Nama produk', name:'name', required:true, placeholder:'Contoh: Kopi Arabika 250g'},
      {view:'text', label:'Kategori', name:'category', placeholder:'Contoh: Minuman'},
      {cols:[{view:'text', label:'Harga (Rp)', name:'price', type:'number', required:true, placeholder:'25000'}, {view:'text', label:'Stok (unit)', name:'stock', type:'number', required:true, placeholder:'20'}]},
      {margin:10, cols:[{view:'button', value:'Batal', click:()=>$$('productWindow').hide()}, {view:'button', value:isEdit?'Simpan perubahan':'Simpan produk', css:'webix_primary', hotkey:'enter', click:saveProduct}]}
    ];
    function saveProduct() {
      const form = $$('productForm');
      if (!form.validate()) { toast('Periksa kembali kolom yang wajib diisi.', 'error'); return; }
      const values = form.getValues();
      values.price = Number(values.price); values.stock = Number(values.stock);
      const url = editingProductId ? `/api/products/${editingProductId}` : '/api/products';
      api(url, {method:editingProductId?'PUT':'POST', body:JSON.stringify(values)})
        .then(result => { $$('productWindow').hide(); toast(result.message); return refreshAll(); })
        .catch(fail);
    }
    if ($$('productWindow')) $$('productWindow').destructor();
    webix.ui({view:'window', id:'productWindow', width:490, position:'center', modal:true, head:isEdit?'Ubah Produk':'Tambah Produk', body:{padding:20, rows:[
      {view:'form', id:'productForm', elements:formElements, rules:{sku:webix.rules.isNotEmpty, name:webix.rules.isNotEmpty, price:v=>v!=='' && Number(v)>=0, stock:v=>v!=='' && Number.isInteger(Number(v)) && Number(v)>=0}}
    ]}}).show();
    if (product) $$('productForm').setValues({sku:product.sku,name:product.name,category:product.category,price:product.price,stock:product.stock});
    else $$('productForm').setValues({category:'Umum',price:0,stock:0});
  }

  function openSaleWindow() {
    if (!productsCache.length) { toast('Tambahkan produk terlebih dahulu.', 'error'); return; }
    if ($$('saleWindow')) $$('saleWindow').destructor();
    function saveSale() {
      const form = $$('saleForm');
      if (!form.validate()) { toast('Pilih produk dan isi jumlah yang valid.', 'error'); return; }
      const values = form.getValues();
      api('/api/sales', {method:'POST', body:JSON.stringify({productId:values.productId, quantity:Number(values.quantity)})})
        .then(result => { $$('saleWindow').hide(); toast(`${result.message} Total ${fmtMoney(result.data.total)}`); return refreshAll(); })
        .catch(fail);
    }
    webix.ui({view:'window', id:'saleWindow', width:490, position:'center', modal:true, head:'Catat Penjualan', body:{padding:20, rows:[
      {view:'template', height:37, id:'productPickerHint', template:'Pilih produk dan jumlah unit yang dijual.', borderless:true, css:'section-sub'},
      {view:'form', id:'saleForm', elements:[
        {view:'combo', id:'saleProduct', label:'Produk', name:'productId', options:productsCache.map(p=>({id:p.id,value:`${p.name} — stok ${p.stock}`})), required:true, placeholder:'Pilih produk'},
        {view:'text', label:'Jumlah unit', name:'quantity', type:'number', value:1, required:true},
        {margin:10, cols:[{view:'button', value:'Batal', click:()=>$$('saleWindow').hide()}, {view:'button', value:'Simpan transaksi', css:'webix_primary', click:saveSale}]}
      ], rules:{productId:webix.rules.isNotEmpty, quantity:v=>Number.isInteger(Number(v)) && Number(v)>0}}
    ]}}).show();
  }

  function toolbar(title, subtitle, buttonLabel, buttonClick) {
    return {cols:[{rows:[{template:`<div class="page-heading">${title}</div><div class="page-sub">${subtitle}</div>`, borderless:true, autoheight:true}]}, {view:'button', value:buttonLabel, width:buttonLabel.length>15?165:145, css:'webix_primary', click:buttonClick}], height:68, padding:{left:3,right:3,top:4,bottom:8}};
  }
  const productColumns = [
    {id:'sku', header:'SKU', width:105}, {id:'name', header:'Nama Produk', fillspace:2, minWidth:150}, {id:'category', header:'Kategori', fillspace:1, minWidth:110},
    {id:'price', header:'Harga', width:130, format:value=>fmtMoney(value)},
    {id:'stock', header:'Stok', width:85, template:obj=>`<span class="${Number(obj.stock)<=5?'stock-low':'stock-ok'}">${obj.stock}</span>`},
    {id:'createdAt', header:'Ditambahkan', width:145, template:obj=>fmtDate(obj.createdAt)}
  ];
  const salesColumns = [
    {id:'productName', header:'Produk', fillspace:2, minWidth:150}, {id:'sku', header:'SKU', width:100}, {id:'quantity', header:'Qty', width:65},
    {id:'unitPrice', header:'Harga Satuan', width:125, format:value=>fmtMoney(value)}, {id:'total', header:'Total', width:130, format:value=>fmtMoney(value)},
    {id:'cashier', header:'Kasir', width:95}, {id:'createdAt', header:'Waktu', width:155, template:obj=>fmtDate(obj.createdAt)}
  ];

  webix.ready(() => {
    webix.ui({container:'app', rows:[
      {view:'toolbar', height:68, padding:{left:18,right:20}, cols:[
        {template:`<div class="top-brand"><img class="top-logo" src="assets/images/Widhi-removebg-preview.png" alt="Widhi"></div>`, borderless:true, width:230},
        {view:'template', template:`<div style="text-align:right;padding-right:8px"><div style="font-size:12px;font-weight:750;color:#243b52">${safe(window.OPTIWARE_USER || '')}</div><div style="font-size:10px;color:#8794a5;margin-top:4px">Administrator</div></div>`, borderless:true, fillspace:true},
        {view:'button', value:'Keluar', width:92, css:'webix_transparent', click:()=>webix.confirm({title:'Keluar dari OptiWare?',text:'Sesi login kamu akan diakhiri.',ok:'Keluar',cancel:'Batal'}).then(()=>api('/api/logout',{method:'POST',body:'{}'})).then(()=>window.location.href='/').catch(fail)}
      ]},
      {cols:[
        {width:220, css:'side', rows:[
          {template:'<div class="nav-heading">MENU UTAMA</div>', height:54, borderless:true},
          {view:'list', id:'navList', css:'side', borderless:true, scroll:false, select:true, template:obj=>`<span style="display:inline-block;width:26px;font-size:15px">${obj.icon}</span>${obj.value}`, data:[
            {id:'overview',value:'Ringkasan',icon:'▦'}, {id:'productsPage',value:'Produk & Stok',icon:'▤'}, {id:'salesPage',value:'Penjualan',icon:'↗'}
          ], on:{onAfterSelect:id=>{ $$('mainViews').setValue(id); if(id==='overview') loadStats().catch(fail); if(id==='productsPage') loadProducts().catch(fail); if(id==='salesPage') loadSales().catch(fail); }}},
          {view:'template', template:'<div class="side-bottom"><strong>OptiWare Workspace</strong>Data inventaris dan penjualan tersimpan di MongoDB Atlas.</div>', borderless:true, autoheight:true},
          {}
        ]},
        {view:'multiview', id:'mainViews', animate:false, cells:[
          {id:'overview', padding:24, rows:[
            {template:'<div class="page-heading">Ringkasan operasional</div><div class="page-sub">Pantau kondisi toko dan aktivitas penjualan dari satu tempat.</div>', borderless:true, height:61},
            {height:16},
            {cols:[
              {view:'template', id:'kpiProducts', template:'<div class="kpi-card"><div class="kpi-head"><span>Jenis Produk</span><span class="kpi-icon">▤</span></div><div class="kpi-value">—</div><div class="kpi-note">Memuat data...</div></div>', borderless:true, height:118},
              {view:'template', id:'kpiStock', template:'<div class="kpi-card"><div class="kpi-head"><span>Total Stok</span><span class="kpi-icon">▣</span></div><div class="kpi-value">—</div><div class="kpi-note">Memuat data...</div></div>', borderless:true, height:118},
              {view:'template', id:'kpiRevenue', template:'<div class="kpi-card"><div class="kpi-head"><span>Total Penjualan</span><span class="kpi-icon">↗</span></div><div class="kpi-value" style="font-size:21px">—</div><div class="kpi-note">Memuat data...</div></div>', borderless:true, height:118},
              {view:'template', id:'kpiLowStock', template:'<div class="kpi-card"><div class="kpi-head"><span>Stok Menipis</span><span class="kpi-icon" style="background:#fff4e3;color:#c47716">!</span></div><div class="kpi-value">—</div><div class="kpi-note">Memuat data...</div></div>', borderless:true, height:118}
            ], height:130, margin:12},
            {height:12},
            {cols:[{rows:[{template:'<div class="panel-heading"><div><h3>Penjualan terbaru</h3><p>Lima transaksi terakhir yang tercatat.</p></div></div>', borderless:true,height:70},{view:'datatable',id:'latestSalesGrid',height:300,scrollX:true,select:false,columns:[{id:'productName',header:'Produk',fillspace:2,minWidth:140},{id:'quantity',header:'Qty',width:55},{id:'total',header:'Total',width:130,format:value=>fmtMoney(value)},{id:'createdAt',header:'Waktu',width:155,template:obj=>fmtDate(obj.createdAt)}],data:[],css:'panel'}]}, {width:18}, {width:190, rows:[{template:'<div class="panel-heading"><div><h3>Aksi cepat</h3><p>Kelola aktivitas toko.</p></div></div>',borderless:true,height:70},{view:'button',value:'＋ Tambah produk',height:44,css:'webix_primary',click:()=>openProductWindow()},{height:10},{view:'button',value:'↗ Catat penjualan',height:44,click:()=>openSaleWindow()},{height:16},{template:'<div style="padding:15px;border-radius:12px;background:#eaf9f6;color:#087f73;font-size:12px;line-height:1.7"><strong>Tips stok</strong><br>Produk dengan stok ≤ 5 unit ditandai agar mudah diperiksa.</div>',borderless:true,autoheight:true},{}]}], stretch:true}
          ]},
          {id:'productsPage', padding:24, rows:[
            toolbar('Produk & Stok','Kelola katalog produk dan jumlah persediaan.','＋ Tambah produk',()=>openProductWindow()),
            {view:'template',template:'<div style="font-size:12px;color:#8491a2;padding:5px 0 12px">Pilih satu baris untuk mengubah atau menghapus produk. Stok ≤ 5 ditandai dengan warna jingga.</div>',height:37,borderless:true},
            {cols:[{view:'button',value:'Ubah produk terpilih',width:165,click:()=>{const p=$$('productsGrid').getSelectedItem();if(!p)return toast('Pilih produk terlebih dahulu.','error');openProductWindow(p);}},{view:'button',value:'Hapus produk',width:130,click:()=>{const p=$$('productsGrid').getSelectedItem();if(!p)return toast('Pilih produk terlebih dahulu.','error');webix.confirm({title:'Hapus produk?',text:`Produk “${safe(p.name)}” akan dihapus dari katalog. Riwayat penjualan tetap disimpan.`,ok:'Hapus',cancel:'Batal'}).then(()=>api(`/api/products/${p.id}`,{method:'DELETE'})).then(r=>{toast(r.message);return refreshAll();}).catch(fail)}},{}, {view:'button',value:'Muat ulang',width:110,click:()=>loadProducts().catch(fail)}],height:45,margin:8},
            {view:'datatable',id:'productsGrid',select:'row',columns:productColumns,data:[],resizeColumn:true,scrollX:true,css:'panel',on:{onItemDblClick:id=>{const p=$$('productsGrid').getItem(id);if(p)openProductWindow(p);}}}
          ]},
          {id:'salesPage', padding:24, rows:[
            toolbar('Penjualan','Catat penjualan dan lihat riwayat transaksi toko.','＋ Catat penjualan',()=>openSaleWindow()),
            {view:'template',template:'<div style="font-size:12px;color:#8491a2;padding:5px 0 12px">Stok produk akan berkurang otomatis setelah transaksi berhasil disimpan.</div>',height:37,borderless:true},
            {cols:[{view:'button',value:'Muat ulang transaksi',width:160,click:()=>loadSales().catch(fail)},{}, {view:'template',template:'<div style="text-align:right;color:#8290a2;font-size:11px;padding:10px 0">Maksimal 500 transaksi terbaru ditampilkan</div>',width:260,borderless:true}],height:40},
            {view:'datatable',id:'salesGrid',select:false,columns:salesColumns,data:[],resizeColumn:true,scrollX:true,css:'panel'}
          ]}
        ]}
      ]}
    ]});
    $$('navList').select('overview');
    refreshAll();
  });
})();
</script>
</body>
</html>
